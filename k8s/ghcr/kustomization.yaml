apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reuse the API configuration, Service and runtime settings from the local setup.
resources:
  - ../local

images:
  - name: jpass-api
    newName: ghcr.io/kimtaeyun02/jpass-api
    newTag: v1
    digest: sha256:d5350c81f8d2e9185ad88af28d0cc13949e14db234979651a2b0b73193b6028b

patches:
  - target:
      kind: Deployment
      name: jpass-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull-secret
