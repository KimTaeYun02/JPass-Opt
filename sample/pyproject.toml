[project]
name = "sample"
version = "0.1.0"
description = ""
authors = [
    {name = "TaeYun",email = "48724872+KimTaeYun02@users.noreply.github.com"}
]
requires-python = ">=3.14"
dependencies = [
    "playwright (>=1.63.0,<2.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "requests (>=2.34.2,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# 최대 줄 길이 설정 (기본값은 88, 보통 88이나 119를 많이 씁니다)
line-length = 88

# 파이썬 타겟 버전 설정
target-version = "py310" 

[tool.ruff.lint]
# 적용할 린터 규칙 선택 (E: pycodestyle, F: Pyflakes, I: isort)
select = ["E", "F", "I"]
# 무시할 규칙
ignore = ["E501"]

[tool.ruff.format]
# 포매팅할 때 따옴표 스타일 (기본값 "double")
quote-style = "double"