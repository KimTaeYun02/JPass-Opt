<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>JR Pass Opt — 여행 동선 데모</title>
  </head>
  <body>
    <div id="app"></div>
    <dialog id="place-dialog" aria-labelledby="search-title">
      <div class="dialog-top"><div><span class="eyebrow">일정에 추가</span><h2 id="search-title">관광지 검색</h2></div><button type="button" data-action="close-search" class="icon-button" aria-label="장소 검색 닫기">×</button></div>
      <label for="demo-search" class="sr-only">장소 검색</label>
      <input id="demo-search" type="search" placeholder="기요미즈데라, 아라시야마…" autocomplete="off" />
      <button type="button" id="search-submit" class="search-submit" data-action="submit-search">검색</button>
      <p class="muted search-caption">여러 관광지를 선택한 뒤 한 번에 추가하세요. 실제 장소 검색은 아직 연결 전이에요.</p>
      <div id="search-selection" class="search-selection"></div>
      <div id="search-results"></div>
      <div class="search-footer"><button type="button" data-action="close-search">취소</button><button type="button" id="search-confirm" class="primary-button" data-action="confirm-search" disabled>0곳 한 번에 추가</button></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
